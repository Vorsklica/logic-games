<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Японський кросворд</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game">
      <header class="game__header">
        <h1 id="gameTitle"></h1>
      </header>

      <section class="game__workspace">
        <div id="gameCorner" class="game__corner"></div>

        <div id="columnHints" class="game__column-hints"></div>

        <div id="rowHints" class="game__row-hints"></div>

        <div id="gameBoard" class="game__board"></div>

        <div id="gameStatus" class="game__status"></div>
      </section>
    </main>

    <div id="restoreModal" hidden class="game__modal">
      <div class="game__modal-content">
        <h2>Знайдено збережену гру</h2>
        <p>Продовжити попередню гру?</p>

        <div class="game__modal-buttons">
          <button id="restoreGameButton">Продовжити</button>
          <button id="newGameButton">Нова гра</button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
