<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Японський кросворд</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game">
      <header class="game__header">
        <h1 id="gameTitle">Заголовок</h1>
      </header>

      <section class="game__workspace">
        <div id="gameCorner" class="game__corner"></div>

        <div id="columnHints" class="game__column-hints">Колонки</div>

        <div id="rowHints" class="game__row-hints">Стовпці</div>

        <div id="gameBoard" class="game__board">Ігрове поле</div>
      </section>

      <footer class="game__footer">
        <div id="gameStatus" class="game__status">Підвал</div>
      </footer>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
