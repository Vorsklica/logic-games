<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Редактор японських кросвордів</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="editor">
    <header id="editor_header" class="editor__header">
      <h1 id="editor_title" class="editor__title"></h1>
    </header>

    <section id="editor_toolbar" class="editor__toolbar">
      <div class="editor__document">
        <label>
          Назва:
          <input id="editor_documentTitle" type="text" />
        </label>
        <span id="editor_massage" class="editor__massage"></span>

        <span id="editor_documentSize" class="editor__value"></span>
      </div>

      <div class="editor__buttons">
        <button id="editor_buttonNew" class="editor__button" type="button">
          Новий
        </button>

        <button id="editor_buttonOpen" class="editor__button" type="button">
          Відкрити
        </button>

        <button id="editor_buttonSave" class="editor__button" type="button">
          Зберегти
        </button>
      </div>
    </section>

    <section id="editor_workspace" class="editor__workspace">
      <div class="editor__corner"></div>
      <div id="editor_columnHints" class="editor__columnHints"></div>

      <div id="editor_rowHints" class="editor__rowHints"></div>

      <div id="editor_board" class="editor__board"></div>
      <!--Вікно повідомлень---------------------------------------------------------->
      <div id="editor_message" class="editor__message editor__message--hidden">
        <div class="editor__messageWindow">
          <p id="editor_messageText"></p>
          <button id="editor_closeMessageButton" class="editor__button">
            Закрити
          </button>
        </div>
      </div>
      <!--Кінець вікна повідомлень----------------------------------------------------->

      <!-- Спеціалізований переглядач альтернативних розв'язків -->
      <div
        id="editor_solutionViewer"
        class="editor__solutionViewer editor__solutionViewer--hidden"
      >
        <div class="editor__solutionWindow">
          <div class="editor__solutionHeader">
            <div id="editor_solutionInfo" class="editor__solutionInfo">
              Розв'язок 1 із 1
            </div>

            <button
              id="editor_solutionCloseButton"
              class="editor__solutionCloseButton"
              type="button"
              title="Закрити"
              aria-label="Закрити"
            >
              ✕
            </button>
          </div>

          <div class="editor__solutionBody">
            <div id="editor_solutionBoard" class="editor__solutionBoard"></div>
          </div>

          <div class="editor__solutionFooter">
            <button
              id="editor_previousSolutionButton"
              class="editor__button editor__solutionNavigationButton"
              type="button"
              title="Попередній розв'язок"
              aria-label="Попередній розв'язок"
            >
              ‹
            </button>

            <button
              id="editor_nextSolutionButton"
              class="editor__button editor__solutionNavigationButton"
              type="button"
              title="Наступний розв'язок"
              aria-label="Наступний розв'язок"
            >
              ›
            </button>
          </div>
        </div>
      </div>
      <!------------------------------------------------------------------------------->
    </section>

    <section id="editor_actions" class="editor__actions">
      <button id="editor_buttonClear" class="editor__button" type="button">
        Очистити
      </button>

      <button id="editor_buttonInvert" class="editor__button" type="button">
        Інвертувати
      </button>

      <button id="editor_buttonValidate" class="editor__button" type="button">
        Перевірити
      </button>

      <button id="editor_buttonExport" class="editor__button" type="button">
        Експорт
      </button>
    </section>

    <footer id="editor_statusBar" class="editor__statusBar">
      <span id="editor_documentName" class="editor__documentName"></span>
      <span id="editor_statusText" class="editor__statusText"></span>
      <span id="editor_statusSize" class="editor__status-size"></span>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
